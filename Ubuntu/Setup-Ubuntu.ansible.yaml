- name: Setup Ubuntu Server
  hosts: ubuntu:&new
  become: true
  ignore_unreachable: true
  tasks:
    - name: Apply SSH Hardening
      ansible.builtin.include_role:
        name: devsec.hardening.ssh_hardening
      vars:
        ssh_custom_options:
          - "Include /etc/ssh/ssh_config.d/*"
        sshd_custom_options:
          - "AcceptEnv LANG"
    - name: Apply OS Hardening
      ansible.builtin.include_role:
        name: devsec.hardening.os_hardening
      vars:
        sysctl_overwrite:
          net.ipv4.ip_forward: 1
    - name: Install Default Packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - nano
          - curl
        state: present
    - name: Create Default User for AZE
      ansible.builtin.user:
        name: 'andreas'
        create_home: true
        state: present
        # groups:
        #  - wheel
    - name: Add authorized key for AZE user
      ansible.posix.authorized_key:
        user: andreas
        state: present
        key: "{{ lookup('url', 'https://files.zeller.sh/LinuxManagment/SSH-Andreas.pub') }}"
    - name: Allow Sudo without Password for User Andreas
      community.general.sudoers:
        name: allow-andreas
        user: andreas
        commands: ALL
        nopassword: true
        state: present
        validation: required
