- name: Install Docker
  become: true
  become_method: ansible.builtin.sudo
  hosts: ubuntu:&docker
  ignore_unreachable: true
  gather_facts: true
  tasks:
    - name: Install prerequires
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
    - name: Install Docker Repo
      block:
        - name: Download Docker key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/trusted.gpg.d/docker_key.asc
            group: root
            owner: root
            mode: 644
        - name: Install Repo
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/docker_key.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker
    - name: APT Update
      ansible.builtin.apt:
        update_cache: true
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present