- name: Setup Unbound on OPNSense
  hosts: opnsense
  connection: local
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ ansible_host }}"
      api_key: "{{ firewallkey }}"
      api_secret: "{{ firewallsecret }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'unbound_forward'
  tasks:
    - name: Install required httpx python module local
      ansible.builtin.pip:
        name: httpx
    - name: Set General Settings
      oxlorg.opnsense.unbound_general:
        enabled: true
        port: 53
        interfaces: ['lan', 'opt2', 'opt3']
        dnssec: true
        dns64: false
        dns64_prefix: '64:ff9b::/96'
        aaaa_only_mode: false
        register_dhcp_leases: false
        dhcp_domain: ''
        register_dhcp_static_mappings: false
        register_ipv6_link_local: true
        register_system_records: true
        txt_records: false
        flush_dns_cache: false
        local_zone_type: 'transparent'
        # outgoing_interfaces: ''
        wpad: false
        reload: true
    - name: Adding nextdns 1
      oxlorg.opnsense.unbound_forward:
        domain: ''
        target: '45.90.28.230'
        description: Default forwarding to NextDNS
    - name: Adding nextdns 2
      oxlorg.opnsense.unbound_forward:
        domain: ''
        target: '45.90.30.230'
        description: Default forwarding to NextDNS
    - name: Adding zeller.sh forwarding to DC01
      oxlorg.opnsense.unbound_forward:
        domain: 'zeller.sh'
        target: '192.168.5.11'
        description: forward Zeller.sh to Domain Controllers
    - name: Adding zeller.sh forwarding to DC02
      oxlorg.opnsense.unbound_forward:
        domain: 'zeller.sh'
        target: '192.168.5.12'
        description: forward Zeller.sh to Domain Controllers
    - name: Adding games.industria.wtf forwarding to DC01
      oxlorg.opnsense.unbound_forward:
        domain: 'games.industria.wtf'
        target: '192.168.5.11'
        description: forward games.industria.wtf to Domain Controllers
    - name: Adding games.industria.wtf forwarding to DC02
      oxlorg.opnsense.unbound_forward:
        domain: 'games.industria.wtf'
        target: '192.168.5.12'
        description: forward games.industria.wtf to Domain Controllers
    - name: Adding files.zeller.sh forwarding to cloudflare dns
      oxlorg.opnsense.unbound_forward:
        domain: 'files.zeller.sh'
        target: '1.1.1.1'
        description: forward files.zeller.sh to cloudflare dns
    - name: Adding files.zeller.sh forwarding to google dns
      oxlorg.opnsense.unbound_forward:
        domain: 'files.zeller.sh'
        target: '8.8.8.8'
        description: forward files.zeller.sh to google dns

